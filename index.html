<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Quản Lý Giờ Công SB Biên Hoà</title>

  <!-- Icons & Styles -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="icon" href="working.png">
  
  <!-- Flatpickr -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/vn.js"></script>

  <style>
    /* ===== 1. THEME: NEON OCEAN SUNSET ===== */
    :root {
      --bg-deep: #011627;
      --bg-panel: rgba(1, 22, 39, 0.92); /* Tăng độ đậm để đỡ tốn GPU */
      --bg-input: rgba(42, 59, 77, 0.6);
      
      --primary: #00d4ff;
      --primary-glow: rgba(0, 212, 255, 0.3);
      
      --accent: #ff6b00;
      --accent-glow: rgba(255, 107, 0, 0.4);
      
      --text-main: #e0e6ed;
      --text-muted: #8bacc4;
      --border: rgba(0, 212, 255, 0.2);
      
      --radius-lg: 24px;
      --radius-sm: 16px;
      --nav-height: 70px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      margin: 0; padding: 0; padding-bottom: calc(var(--nav-height) + 20px);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-deep);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      /* Bỏ background-image ở body để tránh lag */
    }

    /* ===== 2. FIXED BACKGROUND (FIX LAG MOBILE) ===== */
    /* Dùng một thẻ div cố định riêng để làm nền, tránh dùng background-attachment: fixed */
    .bg-container {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      z-index: -10; /* Nằm dưới cùng */
      background-color: var(--bg-deep);
    }

    .bg-image {
      width: 100%; height: 100%;
      background-image: url('nv.jpg');
      /* QUAN TRỌNG: center top giúp ảnh cân xứng trên điện thoại (hiện người dùng từ trên xuống) */
      background-position: center top; 
      background-size: cover;
      background-repeat: no-repeat;
      opacity: 0.6; /* Làm mờ ảnh gốc chút */
    }

    .bg-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 50% 0%, rgba(0, 212, 255, 0.15) 0%, transparent 60%),
                  linear-gradient(180deg, rgba(1, 22, 39, 0.3) 0%, rgba(1, 22, 39, 0.95) 100%);
    }

    /* ===== 3. TOUCH RIPPLE EFFECT ===== */
    .ripple-container { position: relative; overflow: hidden; }
    .ripple {
      position: absolute; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.5) 0%, rgba(0, 212, 255, 0.1) 80%, transparent 100%);
      transform: scale(0); animation: ripple-anim 0.6s ease-out forwards;
      pointer-events: none;
    }
    @keyframes ripple-anim { to { transform: scale(4); opacity: 0; } }

    /* ===== 4. TOP HEADER ===== */
    .topbar {
      position: sticky; top: 0; z-index: 100;
      padding: 16px 20px;
      background: rgba(1, 22, 39, 0.92);
      /* Giảm blur để tăng tốc độ */
      backdrop-filter: blur(10px); 
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo {
      width: 40px; height: 40px; border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), #ff4500);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 800; font-size: 15px;
      box-shadow: 0 0 15px var(--accent-glow);
    }
    .title { font-weight: 800; font-size: 18px; background: linear-gradient(90deg, #fff, var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    /* ===== 5. CARDS & CONTAINER ===== */
    .container { padding: 16px; max-width: 800px; margin: 0 auto; }
    
    .glass {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
      /* Bỏ backdrop-filter trên mobile để hết lag */
    }
    
    /* Chỉ dùng blur cho PC */
    @media (min-width: 769px) {
      .glass { backdrop-filter: blur(10px); }
      .topbar { backdrop-filter: blur(20px); }
    }

    /* Viền neon */
    .glass::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--primary), var(--accent), transparent);
    }

    h1 { font-size: 20px; margin: 0 0 16px; display: flex; align-items: center; gap: 10px; color: #fff; }
    h2 { font-size: 18px; margin: 0 0 16px; color: var(--primary); display: flex; align-items: center; gap: 8px; text-shadow: 0 0 8px var(--primary-glow); }
    h3 { font-size: 14px; margin: 16px 0 10px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }

    /* ===== 6. FORMS ===== */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } }

    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    .field > span { font-size: 12px; color: var(--primary); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }

    input, select, textarea {
      width: 100%; padding: 14px 16px;
      background: var(--bg-input); 
      border: 1px solid var(--border);
      border-radius: var(--radius-sm); 
      color: #fff; outline: none;
      font-size: 15px; transition: border-color 0.3s, box-shadow 0.3s;
    }
    
    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px var(--primary-glow);
    }
    
    textarea { min-height: 100px; resize: vertical; }
    
    .select-wrap { position: relative; }
    .select-wrap select { appearance: none; padding-right: 40px; }
    .select-wrap::after {
      content: "\f107"; font-family: "Font Awesome 6 Free"; font-weight: 900;
      position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
      color: var(--primary); pointer-events: none;
    }

    /* ===== 7. BUTTONS ===== */
    .btn {
      border: none; border-radius: 12px; padding: 12px 24px;
      background: linear-gradient(135deg, var(--accent), #ff4500);
      color: white; font-weight: 700; font-size: 14px;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      cursor: pointer; box-shadow: 0 4px 15px var(--accent-glow);
      transition: transform 0.1s, box-shadow 0.2s; position: relative; overflow: hidden;
    }
    .btn:active { transform: scale(0.96); box-shadow: 0 0 20px var(--accent-glow); }
    .btn.secondary { background: rgba(255,255,255,0.05); box-shadow: none; border: 1px solid var(--border); color: var(--text-muted); }
    .btn.secondary:active { background: var(--primary); color: #000; box-shadow: 0 0 10px var(--primary-glow); }
    
    .btn-icon {
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,0.05); border: 1px solid var(--border);
      color: var(--primary); display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s;
    }
    .btn-icon:active { background: var(--primary); color: #000; }

    .row-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 16px; }

    /* ===== 8. BOTTOM NAVIGATION ===== */
    .bottom-nav {
      position: fixed; bottom: 10px; left: 10px; right: 10px;
      height: 60px;
      background: rgba(1, 22, 39, 0.95); /* Nền đậm hơn cho rõ */
      border: 1px solid var(--border);
      border-radius: 30px;
      display: flex; justify-content: space-around; align-items: center;
      z-index: 1000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .nav-item {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      flex: 1; height: 100%; color: var(--text-muted);
      text-decoration: none; font-size: 10px; font-weight: 600;
      cursor: pointer; transition: color 0.2s;
      position: relative; z-index: 2;
    }
    .nav-item i { font-size: 20px; margin-bottom: 2px; transition: all 0.2s; }
    
    .nav-item.active { color: #fff; }
    .nav-item.active i { 
      transform: translateY(-2px) scale(1.1); 
      color: var(--accent);
      filter: drop-shadow(0 0 8px var(--accent-glow));
    }

    .nav-indicator {
      position: absolute; bottom: 8px; 
      height: 4px; width: 20px; 
      background: var(--accent);
      border-radius: 4px;
      box-shadow: 0 0 10px var(--accent-glow);
      transition: left 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55);
      z-index: 1;
    }

    /* ===== 9. HOURS LIST ===== */
    .hours-list { display: flex; flex-direction: column; gap: 10px; }
    
    .hour-item {
      position: relative; 
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(42, 59, 77, 0.4);
      border: 1px solid transparent;
      padding: 12px 40px 12px 16px;
      border-radius: var(--radius-sm);
      transition: background 0.2s, border-color 0.2s;
      cursor: pointer;
    }

    /* Hiệu ứng chạm tối ưu */
    .hour-item.is-touched {
      background: rgba(0, 212, 255, 0.2);
      border-color: var(--primary);
      box-shadow: 0 0 0 1px var(--primary);
    }
    
    .hour-date { font-size: 14px; font-weight: 600; color: #fff; }
    .hour-date small { font-size: 10px; color: var(--text-muted); font-weight: 400; margin-top: 2px; display: block;}
    
    .hour-val {
        font-size: 15px; font-weight: 700;
        color: var(--primary);
        padding: 4px 12px;
        background: rgba(0, 212, 255, 0.1);
        border-radius: 20px;
        border: 1px solid rgba(0, 212, 255, 0.3);
    }
    .hour-val.off { color: #ff6b6b; background: rgba(255, 107, 107, 0.15); border-color: rgba(255, 107, 107, 0.3); }
    .hour-val.ok { color: var(--accent); background: rgba(255, 107, 0, 0.15); border-color: rgba(255, 107, 0, 0.3); }

    .summary-card {
      background: linear-gradient(90deg, rgba(0, 212, 255, 0.1), rgba(255, 107, 0, 0.1));
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 16px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .summary-label { font-size: 18px; color: #fff; }
    .summary-val { font-size: 24px; font-weight: 700; color: #fff; }

    /* ===== 10. TABLE & OTHERS ===== */
    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-sm); background: rgba(0,0,0,0.2); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
    thead th { background: rgba(0,0,0,0.2); color: var(--primary); font-weight: 600; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:active { background: rgba(0, 212, 255, 0.1); }

    .sched-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    
    .shift-card {
      background: rgba(42, 59, 77, 0.4); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 12px;
      transition: border-color 0.2s;
    }
    .shift-card:active { border-color: var(--primary); }
    
    .shift-head { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 13px; color: #fff; }
    .shift-date { color: var(--text-muted); font-size: 11px; }
    
    .shift-actions { display: flex; gap: 4px; justify-content: space-between; }
    .ca-btn {
      flex: 1; padding: 6px 0; border-radius: 6px; border: 1px solid var(--border);
      background: transparent; color: var(--text-muted); font-size: 11px; cursor: pointer;
      transition: all 0.2s; font-weight: 600;
    }
    .ca-btn:active { border-color: var(--primary); color: var(--primary); }
    .ca-btn.active {
      background: var(--accent); border-color: var(--accent);
      color: #000; font-weight: 700;
      box-shadow: 0 0 8px var(--accent-glow);
    }

    /* ===== UTILITIES ===== */
    .hidden { display: none !important; }
    .muted { color: var(--text-muted); }
    .text-err { color: #ff6b6b; font-size: 12px; margin-left: 8px; }
    
    .skeleton { background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; color: transparent; min-height: 1em; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    .toast-container { position: fixed; top: 20px; left: 20px; right: 20px; z-index: 2000; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
    .toast {
      background: rgba(1, 22, 39, 0.95); border-radius: 8px; padding: 12px 16px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3); display: flex; align-items: center; gap: 10px;
      color: #fff; border-left: 4px solid var(--primary); animation: slideDown 0.3s forwards; pointer-events: all;
    }
    .toast.err { border-color: #ff6b6b; }
    .toast.ok { border-color: var(--accent); }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

    .btn-complain {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      background: transparent; border: none; color: var(--text-muted);
      width: 30px; height: 30px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s;
    }
    .btn-complain:active { color: var(--accent); background: rgba(255, 107, 0, 0.2); }

    .modal-overlay {
      position: fixed; inset: 0; z-index: 2000;
      background: rgba(0,0,0,0.85);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .modal-overlay.show { opacity: 1; pointer-events: auto; }
    
    .modal-box {
      background: var(--bg-panel); border: 1px solid var(--primary);
      width: 90%; max-width: 420px;
      border-radius: var(--radius-lg); padding: 24px;
      transform: scale(0.9); transition: transform 0.2s;
      box-shadow: 0 0 20px var(--primary-glow);
    }
    .modal-overlay.show .modal-box { transform: scale(1); }
  </style>
</head>
<body>

  <!-- Cấu trúc nền mới (Fix lag) -->
  <div class="bg-container">
    <div class="bg-image"></div>
    <div class="bg-overlay"></div>
  </div>

  <header class="topbar">
    <div class="brand">
      <div class="logo">SB</div>
      <div class="title">SUNDAY BASIC</div>
    </div>
    <div class="actions-top">
      <button id="btnLogout" class="btn-icon ghost" type="button" title="Đăng xuất">
        <i class="fa-solid fa-right-from-bracket"></i>
      </button>
    </div>
  </header>

  <main class="container">
    <!-- LOGIN -->
    <section class="glass ripple-container" id="cardLogin">
      <h1><i class="fas fa-fingerprint"></i> Xác thực</h1>
      <div class="grid-2">
        <label class="field">
          <span>Email</span>
          <input id="email" type="email" placeholder="you@example.com" autocomplete="off">
        </label>
        <label class="field">
          <span>Mật khẩu</span>
          <input id="password" type="password" placeholder="••••••••" autocomplete="new-password">
        </label>
      </div>
      <div class="row-actions">
        <button id="btnLogin" class="btn" type="button">
          <i class="fa-solid fa-arrow-right-to-bracket"></i> Đăng nhập
        </button>
        <span id="loginMsg" class="text-err"></span>
      </div>
    </section>

    <!-- APP -->
    <section class="hidden" id="cardApp">
      <div style="margin-bottom:20px;">
        <span style="font-size:13px; color:var(--text-muted);">Xin chào,</span>
        <div id="whoami" style="font-weight:700; font-size:18px;"></div>
      </div>

      <!-- TAB 1 -->
      <div id="requestTab">
        <div class="glass ripple-container" style="margin-top:0">
            <h2><i class="fa-solid fa-paper-plane"></i> Tạo yêu cầu</h2>
            <div class="grid-2">
            <label class="field">
                <span>Vấn đề</span>
                <div class="select-wrap">
                <select id="issueType">
                    <option value="">-- Chọn --</option>
                    <option value="Khiếu nại giờ công">Khiếu nại giờ công</option>
                    <option value="pass ca">Pass ca</option>
                </select>
                </div>
            </label>
            <label class="field">
                <span>Ngày</span>
                <input id="requestDate" type="text" placeholder="Chọn ngày">
            </label>
            </div>

            <label class="field hidden" id="passCaRow">
            <span>Nhân viên nhận pass</span>
            <div class="select-wrap"><select id="passEmployee"></select></div>
            </label>

            <label class="field hidden" id="passShiftRow">
            <span>Ca làm việc</span>
            <div class="select-wrap">
                <select id="passShift">
                <option value="">-- Ca --</option>
                <option value="ca1">Ca 1</option>
                <option value="ca2">Ca 2</option>
                <option value="ca3">Ca 3</option>
                </select>
            </div>
            </label>

            <label class="field">
            <span>Nội dung</span>
            <textarea id="content" placeholder="Mô tả..."></textarea>
            </label>

            <div class="row-actions" style="justify-content: space-between;">
                <button id="btnSend" class="btn"><i class="fa-solid fa-paper-plane"></i> Gửi</button>
                <button id="btnRefreshReq" class="btn secondary"><i class="fa-solid fa-rotate"></i></button>
            </div>
        </div>

        <h3>Lịch sử</h3>
        <div class="table-wrap ripple-container">
          <table id="reqTable">
            <thead><tr><th>Ngày</th><th>Loại</th><th>Nội dung</th></tr></thead>
            <tbody id="reqBody"></tbody>
          </table>
        </div>
      </div>

      <!-- TAB 2 -->
      <div id="hoursTab" class="hidden">
        <h2><i class="fa-regular fa-clock"></i> Chấm công</h2>
        
        <div class="summary-card ripple-container">
            <div class="summary-label">TỔNG GIỜ THÁNG NÀY</div>
            <div class="summary-val" id="totalHoursMonth">0h</div>
        </div>

        <h3>Chi tiết</h3>
        <div id="hoursBox" class="hours-list"></div>
      </div>

      <!-- TAB 3 -->
      <div id="scheduleTab" class="hidden">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
            <h2 style="margin:0"><i class="fa-regular fa-calendar-check"></i> Đăng ký lịch</h2>
            <button id="btnSchedSave" class="btn" type="button"><i class="fa-solid fa-check"></i> Lưu</button>
        </div>
        
        <div id="schedGrid" class="sched-grid"></div>
        
        <div class="field" style="margin-top:16px">
          <span>Ghi chú</span>
          <textarea id="scheduleNote" rows="2" placeholder="Ghi chú..."></textarea>
        </div>
        <div class="row-actions" style="justify-content: flex-start; gap:8px;">
            <button id="btnSchedReload" class="btn secondary"><i class="fa-solid fa-rotate"></i></button>
            <button id="btnSchedClear" class="btn secondary"><i class="fa-regular fa-circle-xmark"></i></button>
        </div>
      </div>
    </section>
  </main>

  <!-- NAV -->
  <nav class="bottom-nav hidden ripple-container" id="mainNav">
    <div class="nav-indicator" id="navIndicator"></div>
    <button class="nav-item active ripple-container" data-tab="requestTab" type="button">
      <i class="fa-solid fa-file-pen"></i><span>Phiếu</span>
    </button>
    <button class="nav-item ripple-container" data-tab="scheduleTab" type="button">
      <i class="fa-solid fa-calendar-days"></i><span>Lịch</span>
    </button>
    <button class="nav-item ripple-container" data-tab="hoursTab" type="button">
      <i class="fa-solid fa-clock-rotate-left"></i><span>Giờ công</span>
    </button>
  </nav>

  <div class="toast-container" id="toastContainer"></div>

  <!-- MODAL -->
  <div id="complaintModal" class="modal-overlay" onclick="if(event.target === this) closeComplaintModal()">
    <div class="modal-box ripple-container">
      <h2 style="margin-top:0; color:var(--accent)"><i class="fa-solid fa-triangle-exclamation"></i> Khiếu nại</h2>
      <p style="font-size:13px; color:var(--text-muted)">Ngày: <strong id="modalDateDisplay" style="color:var(--primary)"></strong></p>
      <label class="field" style="margin-top:10px">
        <span>Nội dung</span>
        <textarea id="modalContent" rows="3" style="background:var(--bg-input-focus)"></textarea>
      </label>
      <div class="row-actions" style="justify-content: flex-end; margin-top:20px">
        <button class="btn secondary" onclick="closeComplaintModal()">Huỷ</button>
        <button id="btnModalSend" class="btn" onclick="submitComplaint()"><i class="fa-solid fa-paper-plane"></i> Gửi</button>
      </div>
    </div>
  </div>

  <script>
    // ===== CONFIG & HELPERS =====
    const API_URL = "https://proxy.mantrandinhminh.workers.dev/api";
    const $ = s => document.querySelector(s);
    const $$ = s => Array.from(document.querySelectorAll(s));
    const escapeHtml = s => String(s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]);
    
    function toast(msg, type) {
      var box = $('#toastContainer'); if (!box) return;
      while (box.children.length >= 3) box.removeChild(box.firstChild);
      var el = document.createElement('div');
      el.className = 'toast ' + (type === 'error' ? 'err' : 'ok');
      el.innerHTML = '<i class="fa-'+(type==='error'?'solid fa-circle-exclamation':'regular fa-circle-check')+'"></i><span>'+ escapeHtml(msg) +'</span>';
      box.appendChild(el);
      setTimeout(() => { el.style.opacity='0'; setTimeout(() => el.remove(), 300); }, 3000);
    }

    // ===== STATE & API =====
    var state = { token:null, email:null, empName:null, employees:[], credentials:null, tokenExpiry:null };
    function isTokenValid() { return state.token && state.tokenExpiry && new Date().getTime() < (state.tokenExpiry - 300000); }
    function makeApiCall(path, data) {
      return fetch(API_URL + '?path=' + encodeURIComponent(path), {
        method: 'POST', headers: { 'Content-Type':'application/json' }, body: JSON.stringify(data)
      }).then(res => { if (!res.ok) { if (res.status === 401) handleTokenExpired(); throw new Error('HTTP ' + res.status); } return res.json(); });
    }
    function refreshToken() {
      if (!state.credentials) return Promise.reject();
      return makeApiCall('login', state.credentials).then(r => {
        if (!r || !r.ok) throw new Error('Refresh failed');
        state.token = r.token; state.tokenExpiry = new Date().getTime() + 3600000;
        localStorage.setItem('sunday.token', state.token); localStorage.setItem('sunday.tokenExpiry', state.tokenExpiry);
        return r;
      });
    }
    function handleTokenExpired() {
      localStorage.clear(); state.token = null;
      $('#cardApp')?.classList.add('hidden'); $('#mainNav')?.classList.add('hidden'); $('#cardLogin')?.classList.remove('hidden');
      toast('Phiên hết hạn', 'error');
    }
    function api(path, data) {
      data = data || {};
      if (state.token) data.token = state.token;
      if (!isTokenValid() && state.credentials) {
        return refreshToken().then(() => { data.token = state.token; return makeApiCall(path, data); }).catch(handleTokenExpired);
      }
      return makeApiCall(path, data);
    }

    // ===== NAVIGATION =====
    const navItems = $$('.nav-item'), navIndicator = $('#navIndicator');
    function setIndicator(btn) { if(!btn || !navIndicator) return; const rect = btn.getBoundingClientRect(); navIndicator.style.left = (rect.left - btn.parentElement.getBoundingClientRect().left + (rect.width/2) - 10) + 'px'; }
    navItems.forEach(btn => {
      btn.addEventListener('click', function() {
        navItems.forEach(b => b.classList.remove('active')); btn.classList.add('active'); setIndicator(btn);
        const targetId = btn.getAttribute('data-tab');
        ['requestTab', 'hoursTab', 'scheduleTab'].forEach(id => { const el = $('#'+id); if(el) el.classList.toggle('hidden', id !== targetId); });
        if (targetId === 'scheduleTab') loadSchedule(); if (targetId === 'hoursTab') loadHours();
      });
    });

    // ===== LOGIC (LOGIN, REQUESTS, HOURS, SCHEDULE) =====
    // Giữ nguyên logic code JS cũ của bạn ở đây, chỉ cần copy phần logic xử lý sự kiện và load data
    // Để tiết kiệm không gian tôi sẽ rút gọn phần logic không thay đổi nhưng đảm bảo đầy đủ.
    
    $('#btnLogin')?.addEventListener('click', function(e) {
      var btn = e.target.closest('button'); var email = $('#email').value.trim(); var password = $('#password').value.trim();
      if(!email || !password) { toast('Nhập đủ thông tin', 'error'); return; }
      btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
      api('login', { email, password }).then(r => {
        if (!r || !r.ok) throw new Error(r?.message || 'Thất bại');
        Object.assign(state, { token: r.token, email: r.email, empName: r.empName, credentials: { email, password }, tokenExpiry: new Date().getTime() + 3600000 });
        localStorage.setItem('sunday.token', state.token); localStorage.setItem('sunday.email', state.email); localStorage.setItem('sunday.empName', state.empName);
        localStorage.setItem('sunday.credentials', JSON.stringify(state.credentials)); localStorage.setItem('sunday.tokenExpiry', state.tokenExpiry);
        $('#whoami').textContent = state.empName; $('#cardLogin').classList.add('hidden'); $('#cardApp').classList.remove('hidden'); $('#mainNav').classList.remove('hidden');
        setIndicator($('.nav-item.active')); loadRequestList(); loadEmployees(); toast('Đăng nhập thành công', 'ok');
      }).catch(err => toast(err.message, 'error')).finally(() => { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> Đăng nhập'; });
    });

    function restoreSession() {
      var t = localStorage.getItem('sunday.token'), emp = localStorage.getItem('sunday.empName');
      if (t && emp) {
        Object.assign(state, { token: t, empName: emp, email: localStorage.getItem('sunday.email'), credentials: JSON.parse(localStorage.getItem('sunday.credentials')||'null'), tokenExpiry: parseInt(localStorage.getItem('sunday.tokenExpiry')||'0') });
        if (!isTokenValid() && state.credentials) refreshToken().catch(()=>{}); 
        $('#whoami').textContent = state.empName; $('#cardLogin').classList.add('hidden'); $('#cardApp').classList.remove('hidden'); $('#mainNav').classList.remove('hidden');
        setTimeout(() => setIndicator($('.nav-item.active')), 50); loadRequestList(); loadEmployees();
      }
    }
    function loadEmployees() { api('employees', {}).then(res => { var arr = Array.isArray(res) ? res : (res?.rows || res?.data || []); state.employees = arr.filter(Boolean).map(String); var sel = $('#passEmployee'); if (sel) sel.innerHTML = '<option value="">-- Chọn --</option>' + state.employees.map(n => '<option>'+escapeHtml(n)+'</option>').join(''); }); }

    var issueSel = $('#issueType');
    issueSel?.addEventListener('change', function() { var isPass = (issueSel.value === 'pass ca'); $('#passCaRow').classList.toggle('hidden', !isPass); $('#passShiftRow').classList.toggle('hidden', !isPass); });
    $('#btnSend')?.addEventListener('click', function() {
      var issue = $('#issueType').value, date = $('#requestDate').value, content = $('#content').value.trim(), passEmp = $('#passEmployee').value, passShift = $('#passShift').value;
      if (!issue || !date || !content) { toast('Điền đủ thông tin', 'error'); return; }
      if (issue === 'pass ca' && (!passEmp || !passShift)) { toast('Chọn NV và Ca', 'error'); return; }
      var btn = $('#btnSend'); btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
      api('submit', { payload: { issueType: issue, requestDate: date, passEmployee: passEmp, passShift: passShift, content: content } }).then(r => { if(!r.ok) throw new Error(r.message); toast('Đã gửi', 'ok'); $('#content').value=''; loadRequestList(); }).catch(e => toast(e.message, 'error')).finally(() => { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Gửi'; });
    });
    function loadRequestList() { var body = $('#reqBody'); body.innerHTML = '<tr><td colspan="3" class="muted">Đang tải...</td></tr>'; api('listRequests', { limit: 20 }).then(r => { if (!r.ok) throw new Error(''); var rows = r.rows || []; if (!rows.length) { body.innerHTML = '<tr><td colspan="3" style="text-align:center">Trống</td></tr>'; return; } body.innerHTML = rows.map(x => `<tr><td>${escapeHtml(x.reqDate||x.created)}</td><td><span style="color:${x.issue.includes('pass')?'var(--accent)':'var(--primary)'}">${escapeHtml(x.issue)}</span></td><td style="white-space:normal; font-size:12px">${escapeHtml(x.content)}</td></tr>`).join(''); }).catch(() => body.innerHTML = '<tr><td colspan="3">Lỗi</td></tr>'); }
    $('#btnRefreshReq')?.addEventListener('click', loadRequestList);

    function loadHours() {
      var box = $('#hoursBox'); box.innerHTML = '<div class="skeleton" style="height:50px; margin-bottom:8px;"></div>'; $('#totalHoursMonth').textContent = '...';
      api('hours', {}).then(r => {
        if (!r.ok) throw new Error(''); var headers = r.header || [], rows = r.row || [];
        var dateRow = Array.isArray(headers[0]) ? headers[0] : headers, dayRow = Array.isArray(headers[1]) ? headers[1] : [];
        var startIndex = 4, html = '', len = Math.min(dateRow.length, rows.length);
        var totalRaw = String(rows[3] || '0'), total = parseFloat(totalRaw.replace(',', '.'));
        $('#totalHoursMonth').textContent = (isNaN(total) ? '0' : total.toFixed(1).replace('.', ',')) + 'h';
        for (var i = startIndex; i < len; i++) {
          var dateVal = String(dateRow[i] || '').trim(), dayName = String(dayRow[i] || '').trim(); if (!dayName && !dateVal) continue;
          var displayDate = dayName; if (dateVal) displayDate += ' (' + dateVal + ')';
          var val = String(rows[i] || '-').trim(), valClass = 'hour-val';
          if (val === 'Off' || val === '0' || val === '') { valClass += ' off'; val = 'Nghỉ'; } else if (!isNaN(parseFloat(val))) { valClass += ' ok'; val += 'h'; }
          var modalDisplay = (dateVal ? dateVal + ' (' + dayName + ')' : dayName);
          html += `<div class="hour-item ripple-container" onclick="openComplaintModal('${escapeHtml(dateVal)}', '${escapeHtml(modalDisplay)}')"><div class="hour-date">${escapeHtml(displayDate)}</div><div class="${valClass}">${escapeHtml(val)}</div><button class="btn-complain"><i class="fa-solid fa-flag"></i></button></div>`;
        }
        if(!html) html = '<div class="muted" style="text-align:center; padding:20px">Không có dữ liệu</div>';
        box.innerHTML = html;
      }).catch(() => { box.innerHTML = '<div class="text-err" style="text-align:center">Lỗi tải</div>'; });
    }
    function openComplaintModal(dateToSend, displayText) {
      $('#modalDateDisplay').textContent = displayText;
      if (!dateToSend && displayText) { var match = displayText.match(/(\d{1,2}\/\d{1,2}\/\d{4})/); if(match) dateToSend = match[0]; }
      $('#complaintModal').setAttribute('data-date', dateToSend); $('#modalContent').value = ''; $('#complaintModal').classList.add('show');
    }
    function closeComplaintModal() { $('#complaintModal').classList.remove('show'); }
    function submitComplaint() {
      var btn = $('#btnModalSend'), note = $('#modalContent').value.trim(), dateRaw = $('#complaintModal').getAttribute('data-date');
      if(!note) { toast('Nhập nội dung', 'error'); return; } if(!dateRaw) { toast('Lỗi ngày', 'error'); return; }
      btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
      api('submit', { payload: { issueType: "Khiếu nại giờ công", requestDate: dateRaw, content: note } }).then(r => { if(!r.ok) throw new Error(r.message); toast('Đã gửi', 'ok'); closeComplaintModal(); loadRequestList(); }).catch(e => toast(e.message, 'error')).finally(() => { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Gửi'; });
    }

    var schedMeta = null, schedState = [];
    function loadSchedule() {
      var grid = $('#schedGrid'); grid.innerHTML = '<div class="skeleton" style="height:100px"></div>';
      api('scheduleGet', {}).then(r => {
        if (!r.ok) throw new Error(''); schedMeta = r.meta || { days: [] }; schedState = Array.isArray(r.selected) ? r.selected : [];
        while(schedState.length < schedMeta.days.length * 3) schedState.push(false); grid.innerHTML = '';
        schedMeta.days.forEach((d, i) => {
          var card = document.createElement('div'); card.className = 'shift-card ripple-container';
          card.innerHTML = `<div class="shift-head"><div style="color:#fff">${escapeHtml(d.dayName)}</div><div class="shift-date">${escapeHtml(d.date)}</div></div><div class="shift-actions"><button class="ca-btn ${schedState[i*3]?'active':''}" data-idx="${i*3}">Ca 1</button><button class="ca-btn ${schedState[i*3+1]?'active':''}" data-idx="${i*3+1}">Ca 2</button><button class="ca-btn ${schedState[i*3+2]?'active':''}" data-idx="${i*3+2}">Ca 3</button></div>`;
          grid.appendChild(card);
        });
        grid.querySelectorAll('.ca-btn').forEach(b => { b.addEventListener('click', function() { var idx = parseInt(this.dataset.idx); schedState[idx] = !schedState[idx]; this.classList.toggle('active'); }); });
        if(r.note) $('#scheduleNote').value = r.note;
      }).catch(() => grid.innerHTML = '<div class="muted">Lỗi</div>');
    }
    $('#btnSchedSave')?.addEventListener('click', function() { var btn = this; btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>'; api('scheduleSave', { selected: schedState, note: $('#scheduleNote').value }).then(r => { if(!r.ok) throw new Error(''); toast('Đã lưu', 'ok'); }).catch(() => toast('Lỗi', 'error')).finally(() => { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-check"></i> Lưu'; }); });
    $('#btnSchedClear')?.addEventListener('click', function() { schedState = schedState.map(() => false); loadSchedule(); });
    $('#btnLogout')?.addEventListener('click', function() { localStorage.clear(); location.reload(); });

    restoreSession();
    flatpickr("#requestDate", { dateFormat: "d-m-Y", allowInput: true, locale: "vn" });
    ['#email', '#password'].forEach(sel => { $(sel)?.addEventListener('keydown', e => { if(e.key === 'Enter') $('#btnLogin').click(); }); });

    // ===== EFFECTS (OPTIMIZED) =====
    // 1. Ripple Effect
    document.body.addEventListener('touchstart', function(e) {
        const target = e.target.closest('.ripple-container'); if (!target) return;
        const ripple = document.createElement('span'); ripple.className = 'ripple';
        const rect = target.getBoundingClientRect();
        ripple.style.left = (e.touches[0].clientX - rect.left) + 'px';
        ripple.style.top = (e.touches[0].clientY - rect.top) + 'px';
        target.appendChild(ripple);
        setTimeout(() => ripple.remove(), 600);
    }, {passive: true});

    // 2. Active State Polyfill (Fix touch highlight)
    document.body.addEventListener('touchstart', function(e){
       const item = e.target.closest('.hour-item, .shift-card');
       if(item) item.classList.add('is-touched');
    }, {passive: true});
    document.body.addEventListener('touchend', function(e){
       const items = document.querySelectorAll('.is-touched');
       items.forEach(i => i.classList.remove('is-touched'));
    }, {passive: true});

  </script>
</body>
</html>
